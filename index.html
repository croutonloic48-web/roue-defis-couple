<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roue des défis de couple</title>
<style>
  #inputs {
  display: none !important;
}
:root{--bg:#101421;--red:#e21f2f;--black:#151515;--gold:#f6b52d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 35%,#40151d 0,#151421 38%,#090b10 100%);font-family:Arial,sans-serif;color:white;display:flex;align-items:center;justify-content:center}
.app{width:min(1200px,95vw);display:grid;grid-template-columns:1fr;gap:28px;align-items:center}
.panel{background:#11152328;border:1px solid #fff2;border-radius:18px;padding:20px;box-shadow:0 15px 50px #0008}
  .panel h1,
.panel .small,
#inputs,
#resetBtn,
#status{
  display:none !important;
}
h1{font-size:24px;margin:0 0 8px}
.small{color:#aeb5c7;font-size:13px;margin-bottom:16px}
label{display:block;font-size:13px;color:#dce1ed;margin:9px 0 5px}
input{width:100%;padding:10px 11px;border-radius:9px;border:1px solid #ffffff25;background:#080b12;color:white;outline:none}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:linear-gradient(180deg,#ff3345,#b80f1f);color:white;font-weight:800;cursor:pointer}
button.secondary{background:#242a3a}
.status{margin-top:12px;font-size:13px;color:#ffcf55;min-height:18px}
  .panel h1,
.panel .small,
#inputs,
#resetBtn,
#status{
  display:none !important;
}

.panel{
  display:contents;
  background:none;
  border:0;
  padding:0;
  box-shadow:none;
}

#spinBtn{
  width:250px;
  margin:15px auto;
  display:block;
}
.stage{display:flex;justify-content:center;position:relative}
.wheel-wrap{position:relative;width:min(720px,78vw);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 35px #000b)}
.pointer{position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:0;border-left:58px solid #e82a39;filter:drop-shadow(0 4px 5px #000)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:transparent;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 12px #ff243d88)} .center img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:800px){.app{grid-template-columns:1fr}.panel{order:2}.stage{order:1}}
</style>
</head>

<script>
const defaultItems=[
 "rien 😅","se que tu veux 😂","embrasser 💋","une fessée 🍑",
 "au choix ❤️","je danse 💃","je fais 67 avec...","me maquiller 💄"
];
let items=[...defaultItems], angle=0, spinning=false, firstSpin=true;
const canvas=document.getElementById('wheel'), ctx=canvas.getContext('2d');
const inputs=document.getElementById('inputs'), status=document.getElementById('status');

defaultItems.forEach((v,i)=>{
  const l=document.createElement('label'); l.textContent=`Case ${i+1}`;
  const inp=document.createElement('input'); inp.value=v; inp.dataset.i=i;
  inp.addEventListener('input',()=>{items[i]=inp.value; draw();});
  inputs.append(l,inp);
});

function draw(){
 const n=items.length, cx=450, cy=450, r=405, step=Math.PI*2/n;
 ctx.clearRect(0,0,900,900);
 ctx.save(); ctx.translate(cx,cy);
 ctx.beginPath();ctx.arc(0,0,r+24,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();
 ctx.lineWidth=22;ctx.strokeStyle='#b77918';ctx.stroke();
 for(let i=0;i<n;i++){
   const a0=angle+i*step-Math.PI/2, a1=a0+step;
   ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();
   ctx.fillStyle=(i%2===0)?'#e32130':'#171717';ctx.fill();
   ctx.lineWidth=3;ctx.strokeStyle='#6b5a42';ctx.stroke();
   // bulbs
   for(let k=0;k<2;k++){
     const a=a0+(k+.5)*step/2;
     ctx.beginPath();ctx.arc(Math.cos(a)*(r+11),Math.sin(a)*(r+11),8,0,Math.PI*2);
     ctx.fillStyle='#fff5bd';ctx.shadowBlur=18;ctx.shadowColor='#ffd35a';ctx.fill();ctx.shadowBlur=0;
   }
   // text
   ctx.save();ctx.rotate(a0+step/2);ctx.translate(r*.68,0);ctx.rotate(Math.PI/2);
   ctx.fillStyle='white';ctx.font='bold 25px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
   let text=items[i]||`Case ${i+1}`;
   if(text.length>18) text=text.slice(0,17)+'…';
   ctx.fillText(text,0,0);ctx.restore();
 }
 ctx.beginPath();ctx.arc(0,0,108,0,Math.PI*2);ctx.fillStyle='#0b0b0d';ctx.fill();
 ctx.restore();
}
draw();

function spinTo(index){
 if(spinning)return;
 spinning=true;
 const n=items.length, step=Math.PI*2/n;
 // Pointer is at the right. Choose the target sector center at angle 0 relative to pointer.
 const targetCenter=-(index*step+step/2);
 const current=angle%(Math.PI*2);
 let delta=targetCenter-current;
 while(delta<0)delta+=Math.PI*2;
 delta += Math.PI*2*(5+Math.floor(Math.random()*3));
 const start=angle, end=angle+delta, duration=4300, t0=performance.now();
 function anim(t){
   const p=Math.min(1,(t-t0)/duration), eased=1-Math.pow(1-p,4);
   angle=start+(end-start)*eased; draw();
   if(p<1) requestAnimationFrame(anim);
   else {spinning=false; status.textContent=`Résultat : ${items[index]||'Case '+(index+1)}`;}
 }
 requestAnimationFrame(anim);
}

document.getElementById('spinBtn').onclick=()=>{
  if(spinning)return;

  let index;

  if(firstSpin){
    // Premier lancer : 50 % de chances de "Me maquiller"
    firstSpin=false;

    const maquillageIndex = items.findIndex(
      item => item.toLowerCase().includes("me maquiller")
    );

    if(maquillageIndex !== -1 && Math.random() < 0.5){
      index = maquillageIndex;
    } else {
      // Les 50 % restants : une autre case au hasard
      const autres = items
        .map((_, i) => i)
        .filter(i => i !== maquillageIndex);

      index = autres[Math.floor(Math.random() * autres.length)];
    }

  } else {
    // Tous les lancers suivants : 100 % aléatoires
    index = Math.floor(Math.random() * items.length);
  }

  spinTo(index);
};
</script>
</body>
</html>
